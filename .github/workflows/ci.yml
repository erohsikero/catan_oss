name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for case-insensitive filename collisions
        run: npm run check:case

      - name: Build all packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Rules engine tests
        run: npm test

      - name: End-to-end smoke test
        run: |
          PORT=8099 HEXHAVEN_BOT_THINK_MS=0 node packages/server/dist/index.js &
          SERVER=$!
          # Wait for the server to answer before driving it.
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/healthz > /dev/null && break
            sleep 1
          done
          SMOKE_URL=ws://127.0.0.1:8099/ws node packages/server/test/smoke.mjs
          status=$?
          kill $SERVER
          exit $status
